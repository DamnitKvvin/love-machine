<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Little Love Machine 💗</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <section class="header">
            <div class="heart-icon">💗</div>

            <h1>Our Little Love Machine</h1>

            <p>
                Distance can't stop me from sending you a little love.
            </p>
        </section>


        <section class="counters">

            <div class="counter-card">
                <span class="counter-icon">🫂</span>
                <span class="counter-number" id="hugCount">0</span>
                <span class="counter-label">Hugs Sent</span>
            </div>

            <div class="counter-card">
                <span class="counter-icon">💋</span>
                <span class="counter-number" id="kissCount">0</span>
                <span class="counter-label">Kisses Sent</span>
            </div>

        </section>


        <section class="actions">

            <button class="love-button hug-button" id="hugButton">
                <span class="button-icon">🫂</span>
                <span>Send Me A Hug</span>
            </button>

            <button class="love-button kiss-button" id="kissButton">
                <span class="button-icon">💋</span>
                <span>Send Me A Kiss</span>
            </button>

        </section>


        <section class="message-box" id="messageBox">

            <div class="message-icon" id="messageIcon">
                💗
            </div>

            <h2 id="messageTitle">
                I'm waiting...
            </h2>

            <p id="messageText">
                Send something my way.
            </p>

        </section>


        <section class="recent">

            <div class="section-title">
                Recent Love 💌
            </div>

            <div id="recentActions" class="recent-actions">
                <div class="empty-state">
                    No hugs or kisses yet...
                </div>
            </div>

        </section>


        <footer>
            Made with a little bit of code and a lot of love. ❤️
        </footer>

    </main>


    <script src="script.js"></script>

</body>
</html>
